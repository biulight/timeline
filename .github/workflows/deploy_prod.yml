name: Deploy Production
run-name: Deploy ${{ github.sha }} by @${{ github.actor }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize both deployment targets; never cancel a deployment already in progress.
concurrency:
  group: deployment-prod
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      servers: ${{ steps.check.outputs.servers }}
    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Production deployments must run from main"
            exit 1
          fi
      - name: Check deployment configuration
        id: check
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALY_SSH_TOKEN }}
          SERVERS: ${{ vars.DEPLOY_SERVERS }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing secrets.ALY_SSH_TOKEN"
            exit 1
          fi
          if ! jq -se '
            length == 1 and (.[0] |
            type == "array" and length > 0 and
            all(.[];
              type == "object" and
              (.host | type == "string" and length > 0) and
              (.user | type == "string" and length > 0)
            ))
          ' <<< "$SERVERS" > /dev/null; then
            echo "::error::DEPLOY_SERVERS must be a non-empty JSON array of objects with host and user strings"
            exit 1
          fi
          echo "servers=$(jq -c . <<< "$SERVERS")" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/
          retention-days: 2
      - name: Upload server artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-dist
          path: build/
          retention-days: 2
          if-no-files-found: error

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Re-running old jobs must not restore an obsolete site over main.
      - name: Require current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::This run is no longer main HEAD. Start a new Deploy Production run from main."
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        server: ${{ fromJson(needs.preflight.outputs.servers) }}
    steps:
      - name: Download server artifact
        uses: actions/download-artifact@v6
        with:
          name: build-dist
          path: build
      - name: Verify artifact and deployment tools
        run: |
          test -s build/index.html
          command -v ssh
          command -v rsync
      # Re-running old jobs must not restore an obsolete site over main.
      - name: Require current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::This run is no longer main HEAD. Start a new Deploy Production run from main."
            exit 1
          fi
      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v5.1.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ALY_SSH_TOKEN }}
          REMOTE_HOST: ${{ matrix.server.host }}
          REMOTE_USER: ${{ matrix.server.user }}
          REMOTE_PORT: '22'
          ARGS: '-rltgoDzvO --delete'
          SOURCE: 'build/'
          TARGET: '/var/www/timeline'

  deployment-result:
    if: always() && github.ref == 'refs/heads/main'
    needs: [preflight, build, deploy, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Check both deployment targets
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SERVER_RESULT: ${{ needs.deploy.result }}
          PAGES_RESULT: ${{ needs.deploy-pages.result }}
        run: |
          {
            echo "### Deployment: $GITHUB_SHA"
            echo "- Preflight: $PREFLIGHT_RESULT"
            echo "- Build: $BUILD_RESULT"
            echo "- Servers: $SERVER_RESULT"
            echo "- Pages: $PAGES_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$PREFLIGHT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$SERVER_RESULT" = success
          test "$PAGES_RESULT" = success
